# Explicit development profile only. The public OSRM demo has no availability SLA.
# Production must supply BOOKING_ROUTING_URL for its own OSRM-compatible service.
booking.routing-url=${BOOKING_ROUTING_URL:https://router.project-osrm.org}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:5174}
logging.level.com.diladrive.service.CustomerTripService=DEBUG
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.config.import=optional:file:./driver-data.env.local[.properties]
