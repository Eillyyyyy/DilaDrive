server:
  port: 8080

spring:
  application:
    name: diladrive-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/diladrive}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Kuala_Lumpur

app:
  jwt:
    # Base64-encoded key, at least 32 bytes. Override with JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:ZGlsYWRyaXZlLWRldi1vbmx5LXNlY3JldC1rZXktY2hhbmdlLW1lLTEyMzQ1Ng==}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin-seed:
    email: ${DILADRIVE_ADMIN_EMAIL:admin@diladrive.local}
    username: ${DILADRIVE_ADMIN_USERNAME:admin}
    password: ${DILADRIVE_ADMIN_PASSWORD:ChangeMe123!}
    full-name: ${DILADRIVE_ADMIN_NAME:Fadilah Zakariah}
    phone: ${DILADRIVE_ADMIN_PHONE:0196668073}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
