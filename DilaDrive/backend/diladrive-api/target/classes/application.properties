# React Admin --\
#                +--> Spring Boot API (0.0.0.0:8080) --> PostgreSQL
# Flutter ------/
spring.application.name=diladrive-api
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:strict}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:DilaDrive}}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.verification-photos.storage-dir=${VERIFICATION_PHOTO_STORAGE_DIR:./uploads/verification-photos}
app.payment-proofs.storage-dir=${PAYMENT_PROOFS_STORAGE_DIR:./uploads/payment-proofs}

app.documents.company-name=${DOCUMENT_COMPANY_NAME:DilaDrive Transport Management System}
app.documents.company-address=${DOCUMENT_COMPANY_ADDRESS:}
app.documents.company-email=${DOCUMENT_COMPANY_EMAIL:}
app.documents.company-phone=${DOCUMENT_COMPANY_PHONE:}
app.documents.company-website=${DOCUMENT_COMPANY_WEBSITE:}
app.documents.quotation-terms=${DOCUMENT_QUOTATION_TERMS:Prices are stated in Malaysian Ringgit (RM). Final service arrangements are subject to booking confirmation.}
app.documents.quotation-validity-days=${DOCUMENT_QUOTATION_VALIDITY_DAYS:30}
app.documents.invoice-due-days=${DOCUMENT_INVOICE_DUE_DAYS:30}
